---
openapi: 3.2.0
info:
  title: Algo Sangaku Documentation
  version: 1.0.0
servers: []
paths:
  "/api/v1/admin/sangakus":
    get:
      summary: index
      tags:
      - Api::V1::Admin::Sangaku
      responses:
        '200':
          description: returns 200 with sangakus list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            title:
                              type: string
                            difficulty:
                              type: string
                            created_at:
                              type: string
                            user_name:
                              type: string
                            shrine_name:
                              type: 'null'
                            description:
                              type: string
                            source:
                              type: string
                          required:
                          - title
                          - difficulty
                          - created_at
                          - user_name
                          - shrine_name
                      required:
                      - id
                      - type
                      - attributes
                required:
                - data
              example:
                data:
                - id: '169'
                  type: sangaku
                  attributes:
                    title: test_title
                    description: test_description
                    source: puts 'Hello world'
                    difficulty: easy
                    created_at: '2026-09-01T00:01:40.910+09:00'
                    user_name: test nickname
                    shrine_name:
        '401':
          description: returns 401
          content:
            text/plain:
              schema:
                type: string
              example: 'HTTP Token: Access denied.

                '
        '403':
          description: returns 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
                    items: {}
                required:
                - message
                - errors
              example:
                message: Forbidden
                errors: []
  "/api/v1/admin/sangakus/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Admin::Sangaku
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 186
      responses:
        '200':
          description: returns 200 and deletes the sangaku
          content:
