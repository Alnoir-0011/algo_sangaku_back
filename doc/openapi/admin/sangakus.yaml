                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          title:
                            type: string
                          difficulty:
                            type: string
                          created_at:
                            type: string
                          user_name:
                            type: string
                          shrine_name:
                            type: 'null'
                          description:
                            type: string
                          source:
                            type: string
                        required:
