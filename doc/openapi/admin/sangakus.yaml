              example:
                data:
                  id: '176'
                  type: sangaku
                  attributes:
                    title: 更新タイトル
                    description: 更新説明文
                    source: puts 'updated'
                    difficulty: normal
                    created_at: '2026-09-01T00:01:41.047+09:00'
