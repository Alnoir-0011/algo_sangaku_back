                          user_name:
                            type: string
                          shrine_name:
                            type: 'null'
                          description:
                            type: string
                          source:
                            type: string
                        required:
                        - title
                        - difficulty
                        - created_at
                        - user_name
                        - shrine_name
                    required:
                    - id
                    - type
                    - attributes
                required:
                - data
              example:
                data:
                  id: '182'
                  type: sangaku
                  attributes:
                    title: test_title
                    difficulty: easy
                    created_at: '2026-09-01T00:01:41.200+09:00'
                    user_name: test nickname
                    shrine_name:
                    description: test_description
                    source: puts 'Hello world'
        '401':
          description: returns 401
          content:
            text/plain:
              schema:
