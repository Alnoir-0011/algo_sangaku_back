                          source:
                            type: string
                          difficulty:
                            type: string
                          created_at:
                            type: string
                          user_name:
                            type: string
                          shrine_name:
                            type: 'null'
                        required:
                        - title
                        - description
                        - source
                        - difficulty
                        - created_at
                        - user_name
                        - shrine_name
                    required:
