---
openapi: 3.2.0
info:
  title: Algo Sangaku Documentation
  version: 1.0.0
servers: []
paths:
  "/api/v1/user/profile":
    get:
      summary: show
      tags:
      - Api::V1::User::Profile
      responses:
        '200':
          description: 認証に成功しマイプロフィールを返す
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          email:
                            type: string
                          nickname:
                            type: string
                          show_answer_count:
                            type: boolean
                          created_at:
                            type: string
                          sangaku_count:
                            type: integer
                          dedicated_sangaku_count:
                            type: integer
                          saved_sangaku_count:
                            type: integer
                          answer_count:
                            type: integer
                        required:
                        - email
                        - nickname
                        - show_answer_count
                        - created_at
                        - sangaku_count
                        - dedicated_sangaku_count
                        - saved_sangaku_count
                        - answer_count
                    required:
                    - id
                    - type
                    - attributes
                required:
                - data
              example:
                data:
                  id: '602'
                  type: my_profile
                  attributes:
                    email: user_220@example.com
                    nickname: test nickname
                    show_answer_count: false
                    created_at: '2026-09-01T00:01:42.641+09:00'
                    sangaku_count: 0
                    dedicated_sangaku_count: 0
                    saved_sangaku_count: 0
                    answer_count: 0
        '401':
          description: 認証に失敗し 401 を返す
          content:
            text/plain:
              schema:
                type: string
              example: 'HTTP Token: Access denied.

                '
    patch:
      summary: update
      tags:
      - Api::V1::User::Profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    nickname:
                      type: string
                    show_answer_count:
                      type: boolean
              required:
              - user
            example:
              user:
                nickname: changed_name
                show_answer_count: true
      responses:
        '200':
          description: show_answer_count を true に更新できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          provider:
                            type: string
                          uid:
                            type: string
                          name:
                            type: string
                          email:
                            type: string
                          nickname:
                            type: string
                          role:
                            type: string
                        required:
                        - provider
                        - uid
                        - name
                        - email
                        - nickname
                    required:
                    - id
                    - type
                    - attributes
                required:
                - data
              example:
                data:
                  id: '605'
                  type: user
                  attributes:
                    provider: google
                    uid: 36ba77a5-8fd3-4cd5-b939-6a856abdd3e4
                    name: test user
                    email: user_223@example.com
                    nickname: test nickname
                    role: general
