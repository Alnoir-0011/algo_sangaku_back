---
openapi: 3.2.0
info:
  title: Algo Sangaku Documentation
  version: 1.0.0
servers: []
paths:
  "/api/v1/user/code_sangakus":
    post:
      summary: create
      tags:
      - Api::V1::User::CodeSangaku
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sangaku:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    source:
                      type: string
                    difficulty:
                      type: string
                  required:
                  - title
                  - description
                  - source
                  - difficulty
                fixed_inputs:
                  type: array
                  items:
                    type: string
              required:
              - sangaku
              - fixed_inputs
            example:
              sangaku:
                title: test_title
                description: test_description
                source: puts 'Hello world'
                difficulty: easy
              fixed_inputs:
              - test_input_2
      responses:
        '200':
          description: success to create sangaku
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          title:
                            type: string
                          description:
                            type: string
                          difficulty:
                            type: string
                          kind:
                            type: string
                          source:
                            type: string
                          inputs:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                content:
                                  type: string
                              required:
                              - id
                              - content
                          author_name:
                            type: string
                          shrine_name:
                            type: 'null'
                          code_blocks:
                            type: array
                            items: {}
                        required:
                        - title
                        - description
                        - difficulty
                        - kind
                        - source
                        - inputs
                        - author_name
                        - shrine_name
                        - code_blocks
                      relationships:
                        type: object
                        properties:
                          user:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                required:
                                - id
                                - type
                            required:
                            - data
                          shrine:
                            type: object
                            properties:
                              data:
                                type: 'null'
                            required:
                            - data
                        required:
                        - user
                        - shrine
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                required:
                - data
              example:
                data:
                  id: '17425'
                  type: sangaku
                  attributes:
                    title: test_title
                    description: test_description
                    difficulty: easy
                    kind: code
                    source: puts 'Hello world'
                    inputs:
                    - id: 3249
                      content: test_input_2
                    author_name: test nickname
                    shrine_name:
                    code_blocks: []
                  relationships:
                    user:
                      data:
                        id: '33046'
                        type: user
                    shrine:
                      data:
  "/api/v1/user/code_sangakus/generate_source":
    post:
      summary: generate_source
      tags:
      - Api::V1::User::CodeSangaku
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
              required:
              - description
            example:
              description: 1からnまでの合計を計算して出力してください
      responses:
        '200':
          description: calls OpenAI API with wrapped description
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  usage:
                    type: object
                    properties:
                      used:
                        type: integer
                      limit:
                        type: integer
                      remaining:
                        type: integer
                      reset_at:
                        type: string
                    required:
                    - used
                    - limit
                    - remaining
                    - reset_at
                required:
                - source
                - usage
              example:
                source: |-
                  # 対応言語: Ruby
                  n = gets.chomp.to_i
                  puts (1..n).sum
                usage:
                  used: 1
                  limit: 5
                  remaining: 4
                  reset_at: '2026-09-15T03:00:00+09:00'
  "/api/v1/user/code_sangakus/generate_source_usage":
    get:
      summary: generate_source_usage
      tags:
      - Api::V1::User::CodeSangaku
      responses:
        '200':
          description: does not count other users' logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  used:
                    type: integer
                  limit:
                    type: integer
                  remaining:
                    type: integer
                  reset_at:
                    type: string
                required:
                - used
                - limit
                - remaining
                - reset_at
              example:
                used: 0
                limit: 5
                remaining: 5
                reset_at: '2026-09-15T03:00:00+09:00'
  "/api/v1/user/code_sangakus/{id}":
    patch:
      summary: update
      tags:
      - Api::V1::User::CodeSangaku
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 17426
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sangaku:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    source:
                      type: string
                    difficulty:
                      type: string
                  required:
                  - title
                  - description
                  - source
                  - difficulty
                fixed_inputs:
                  type: array
                  items:
                    type: string
              required:
              - sangaku
              - fixed_inputs
            example:
              sangaku:
                title: changed_title
                description: test_description
                source: puts 'Hello world'
                difficulty: easy
              fixed_inputs:
              - a
      responses:
        '200':
          description: success to update sangaku
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          title:
                            type: string
                          description:
                            type: string
                          difficulty:
                            type: string
                          kind:
                            type: string
                          source:
                            type: string
                          inputs:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                content:
                                  type: string
                              required:
                              - id
                              - content
                          author_name:
                            type: string
                          shrine_name:
                            type: 'null'
                          code_blocks:
                            type: array
                            items: {}
                        required:
                        - title
                        - description
                        - difficulty
                        - kind
                        - source
                        - inputs
                        - author_name
                        - shrine_name
                        - code_blocks
                      relationships:
                        type: object
                        properties:
                          user:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                required:
                                - id
                                - type
                            required:
                            - data
                          shrine:
                            type: object
                            properties:
                              data:
                                type: 'null'
                            required:
                            - data
                        required:
                        - user
                        - shrine
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                required:
                - data
              example:
                data:
                  id: '17426'
                  type: sangaku
                  attributes:
                    title: changed_title
                    description: test_description
                    difficulty: easy
                    kind: code
                    source: puts 'Hello world'
                    inputs:
                    - id: 3250
                      content: a
                    author_name: test nickname
                    shrine_name:
                    code_blocks: []
                  relationships:
                    user:
                      data:
                        id: '33054'
                        type: user
                    shrine:
                      data:
