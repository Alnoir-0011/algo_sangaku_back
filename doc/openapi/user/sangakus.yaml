                                  - type
                              required:
                              - data
                            shrine:
                              type: object
                              properties:
                                data:
                                  type:
                                  - object
                                  - 'null'
                                  properties:
                                    id:
                                      type: string
                                    type:
                                      type: string
                                  required:
                                  - id
                                  - type
                              required:
                              - data
                          required:
                          - user
                          - shrine
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                required:
                - data
              example:
                data:
                - id: '17507'
                  type: sangaku
                  attributes:
                    title: test_title
                    description: test_description
                    difficulty: easy
                    kind: code
                    source: puts 'Hello world'
                    inputs: []
                    author_name: test nickname
                    shrine_name: test_shrine
                  relationships:
                    user:
                      data:
                        id: '33171'
                        type: user
                    shrine:
                      data:
                        id: '6834'
                        type: shrine
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
        example: code
      - name: shrine_id
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: integer
        example: any
      - name: title
        in: query
        required: false
        schema:
          type: string
        example: another
