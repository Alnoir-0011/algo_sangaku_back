                              type: string
                            description:
                              type: string
                            source:
                              type: string
                            difficulty:
                              type: string
                            inputs:
                              type: array
                              items: {}
                            author_name:
                              type: string
                            shrine_name:
                              type:
                              - string
                              - 'null'
                            kind:
                              type: string
                          required:
                          - title
                          - description
                          - difficulty
                          - source
                          - inputs
                          - author_name
                        relationships:
                          type: object
                          properties:
                            user:
                              type: object
                              properties:
