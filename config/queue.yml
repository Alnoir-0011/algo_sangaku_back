default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      # fork モードでは processes がそのまま worker の生成数になる。
      # 0 にすると worker が 1 つも起動せずジョブが永久に処理されないため 1 未満にしない。
      processes: 1
      polling_interval: 0.1
